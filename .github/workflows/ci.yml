# Ordinary CI. It runs the pull request's own code, so it runs on `pull_request`: for a fork that means a read-only
# token and no secrets. It must never become `pull_request_target`.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm test
      # kit/ is eziee's checking code. It may only ever be an exact copy of the template's, at the commit in kit.lock.
      - run: pnpm sync-kit --check
      - run: pnpm --filter site test
      - run: pnpm --filter site build

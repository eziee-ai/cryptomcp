# Ordinary CI. It runs the pull request's own code, so it runs on `pull_request`: for a fork that means a read-only
# token and no secrets. It must never become `pull_request_target`.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm test
      # kit/ is eziee's checking code. It may only ever be an exact copy of the template's, at the commit in kit.lock.
      - run: pnpm sync-kit --check
      - run: pnpm --filter site test
      - run: pnpm --filter site build
